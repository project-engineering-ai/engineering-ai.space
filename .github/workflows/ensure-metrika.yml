name: Ensure Yandex.Metrika on HTML
on:
  push:
    branches: ["main"]
    paths: ["**/*.html"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Metrika (idempotent)
        run: python3 scripts/inject_metrika.py --cid 112548629 --root .
      - name: Commit if changed
        run: |
          git config user.name "metrika-bot"
          git config user.email "metrika-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: restore Yandex.Metrika in regenerated HTML"
            git push
          else
            echo "tracking present, nothing to do"
          fi
